<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - เข้าสู่ระบบผู้ดูแลระบบ</title>

    <!-- Google Fonts & FontAwesome -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- CSS ทั้งหมด -->
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-dark: #0f172a;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
        }

        body {
            font-family: 'Sarabun', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
        }

        .back-btn {
            position: absolute;
            top: 24px;
            left: 24px;
            color: #ffffff;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.1);
            padding: 10px 18px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            transition: all 0.2s ease;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateX(-3px);
        }

        .login-card {
            background-color: var(--card-bg);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 420px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .brand-icon {
            width: 60px;
            height: 60px;
            background-color: #e0e7ff;
            color: var(--primary);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            margin: 0 auto 20px auto;
        }

        .login-card h2 {
            text-align: center;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 6px;
        }

        .login-card p.subtitle {
            text-align: center;
            margin-bottom: 28px;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #334155;
            font-size: 0.875rem;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .toggle-password {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.95rem;
            transition: color 0.2s ease;
        }

        .toggle-password:hover {
            color: var(--primary);
        }

        .input-wrapper input {
            width: 100%;
            padding: 12px 42px 12px 42px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            font-size: 0.95rem;
            font-family: inherit;
            outline: none;
            transition: all 0.2s ease;
            background-color: #f8fafc;
        }

        .input-wrapper input:focus {
            background-color: #ffffff;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
        }

        .login-btn {
            width: 100%;
            background-color: var(--primary);
            color: white;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-top: 10px;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25);
        }

        .login-btn:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
        }
    </style>
</head>
<body>

    <!-- ปุ่มย้อนกลับไปหน้าแรก -->
    <a href="index.html" class="back-btn">
        <i class="fa-solid fa-arrow-left"></i> กลับหน้าฟอร์ม
    </a>

    <!-- การ์ดฟอร์มเข้าสู่ระบบ -->
    <div class="login-card">
        <div class="brand-icon">
            <i class="fa-solid fa-user-shield"></i>
        </div>
        <h2>เข้าสู่ระบบ Admin</h2>
        <p class="subtitle">กรอกชื่อผู้ใช้และรหัสผ่านเพื่อเข้าใช้งาน</p>

        <form id="loginForm">
            <div class="form-group">
                <label for="username">ชื่อผู้ใช้ (Username)</label>
                <div class="input-wrapper">
                    <input type="text" id="username" required placeholder="กรอก Username" autocomplete="username">
                    <i class="fa-solid fa-user input-icon"></i>
                </div>
            </div>
            <div class="form-group">
                <label for="password">รหัสผ่าน (Password)</label>
                <div class="input-wrapper">
                    <input type="password" id="password" required placeholder="กรอก Password" autocomplete="current-password">
                    <i class="fa-solid fa-lock input-icon"></i>
                    <i class="fa-solid fa-eye-slash toggle-password" id="togglePassword"></i>
                </div>
                <div style="text-align: right; margin-top: 10px; margin-bottom: 18px;">
                    <a href="#" id="forgotPassword" style="color: #64748b; font-size: 0.85rem; text-decoration: none; transition: color 0.2s;">
                        <i class="fa-solid fa-key"></i> ลืมรหัสผ่าน?
                    </a>
                </div>
            </div>
            <button type="submit" class="login-btn">
                <i class="fa-solid fa-right-to-bracket"></i> เข้าสู่ระบบ
            </button>
        </form>
    </div>

    <!-- JS ทั้งหมด -->
    <script>
        // ==========================================
        // 1. ฟังก์ชันจัดการข้อมูลบัญชีผู้ใช้ (localStorage)
        // ==========================================

        // ดึงรายชื่อผู้ใช้ทั้งหมด (หากไม่มีใน localStorage จะคืนค่า Default)
        function getAdminUsers() {
            const defaultUsers = [
                { username: 'honging957', password: '5871289', role: 'superadmin' },
                { username: 'admin', password: '1234', role: 'admin' }
            ];
            return JSON.parse(localStorage.getItem('adminUsers')) || defaultUsers;
        }

        // ฟังก์ชันเช็คว่าผู้ใช้ปัจจุบันเป็น Superadmin หรือไม่
        function isSuperAdmin() {
            const currentUser = JSON.parse(sessionStorage.getItem('currentUser'));
            return currentUser && currentUser.role === 'superadmin';
        }

        // ==========================================
        // 2. ทำงานเมื่อโหลดหน้าเว็บเสร็จ (DOM Loaded)
        // ==========================================
        document.addEventListener('DOMContentLoaded', () => {
            const loginForm = document.getElementById('loginForm');
            const usernameInput = document.getElementById('username');
            const passwordInput = document.getElementById('password');
            const togglePasswordBtn = document.getElementById('togglePassword');
            const forgotPasswordBtn = document.getElementById('forgotPassword');

            // 2.1 เช็คเฉพาะถ้ามีฟอร์ม Login และล็อกอินค้างไว้แล้ว ถึงจะส่งไปหน้า Dashboard
            if (loginForm && sessionStorage.getItem('currentUser')) {
                window.location.href = 'admin-dashboard.html';
                return;
            }

            // 2.2 ระบบ ซ่อน/แสดง รหัสผ่าน
            if (togglePasswordBtn && passwordInput) {
                togglePasswordBtn.addEventListener('click', () => {
                    const isPassword = passwordInput.type === 'password';
                    passwordInput.type = isPassword ? 'text' : 'password';
                    
                    togglePasswordBtn.classList.toggle('fa-eye', !isPassword);
                    togglePasswordBtn.classList.toggle('fa-eye-slash', isPassword);
                });
            }

            // 2.3 จัดการการ Submit ฟอร์มล็อกอิน
            if (loginForm) {
                loginForm.addEventListener('submit', (e) => {
                    e.preventDefault();

                    const username = usernameInput.value.trim();
                    const password = passwordInput.value;

                    if (!username || !password) {
                        Swal.fire({
                            title: 'กรอกข้อมูลไม่ครบ',
                            text: 'กรุณากรอกทั้งชื่อผู้ใช้และรหัสผ่าน',
                            icon: 'warning',
                            confirmButtonColor: '#4f46e5'
                        });
                        return;
                    }

                    const adminUsers = getAdminUsers();
                    const user = adminUsers.find(u => u.username === username && u.password === password);

                    if (user) {
                        sessionStorage.setItem('currentUser', JSON.stringify({
                            username: user.username,
                            role: user.role,
                            loginTime: Date.now()
                        }));

                        Swal.fire({
                            title: 'เข้าสู่ระบบสำเร็จ!',
                            text: `ยินดีต้อนรับคุณ ${user.username} (ระดับ: ${user.role})`,
                            icon: 'success',
                            timer: 1200,
                            showConfirmButton: false
                        }).then(() => {
                            window.location.href = 'admin-dashboard.html';
                        });
                    } else {
                        Swal.fire({
                            title: 'เข้าสู่ระบบไม่สำเร็จ',
                            text: 'ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง โปรดลองอีกครั้ง',
                            icon: 'error',
                            confirmButtonColor: '#ef4444'
                        });
                        passwordInput.value = '';
                    }
                });
            }

            // 2.4 จัดการปุ่ม "ลืมรหัสผ่าน?"
            if (forgotPasswordBtn) {
                forgotPasswordBtn.addEventListener('click', (e) => {
                    e.preventDefault();

                    const MASTER_PIN = localStorage.getItem('masterPin') || '5871289';

                    Swal.fire({
                        title: 'ยืนยันตัวตนเพื่อรีเซ็ตรหัสผ่าน',
                        text: 'กรุณากรอกรหัสความปลอดภัยหลัก (Master PIN) เพื่อดำเนินการ',
                        input: 'password',
                        inputPlaceholder: 'กรอกรหัส PIN',
                        inputAttributes: {
                            maxlength: '10',
                            autocapitalize: 'off',
                            autocorrect: 'off'
                        },
                        icon: 'warning',
                        showCancelButton: true,
                        confirmButtonText: 'ยืนยันรีเซ็ต',
                        cancelButtonText: 'ยกเลิก',
                        confirmButtonColor: '#4f46e5',
                        cancelButtonColor: '#64748b',
                        inputValidator: (value) => {
                            if (!value) {
                                return 'กรุณากรอกรหัสความปลอดภัย!';
                            }
                        }
                    }).then((result) => {
                        if (result.isConfirmed) {
                            if (result.value === MASTER_PIN) {
                                localStorage.removeItem('adminUsers');

                                Swal.fire({
                                    title: 'รีเซ็ตสำเร็จ!',
                                    text: 'ระบบถูกคืนค่าบัญชีเป็น honging957 / 5871289 และ admin / 1234 เรียบร้อยแล้ว',
                                    icon: 'success',
                                    confirmButtonColor: '#4f46e5'
                                });
                            } else {
                                Swal.fire({
                                    title: 'รหัสไม่ถูกต้อง!',
                                    text: 'ไม่อนุญาตให้รีเซ็ตรหัสผ่าน',
                                    icon: 'error',
                                    confirmButtonColor: '#ef4444'
                                });
                            }
                        }
                    });
                });
            }
        });

        // ==========================================
        // 3. ฟังก์ชันสำหรับเรียกใช้งาน ( Dashboard / Admin )
        // ==========================================

        // ฟังก์ชันสร้างบัญชี Admin ใหม่ (เฉพาะ Superadmin)
        function createNewAdmin() {
            const currentUser = JSON.parse(sessionStorage.getItem('currentUser'));

            if (!currentUser || currentUser.role !== 'superadmin') {
                Swal.fire('ปฏิเสธการเข้าถึง', 'เฉพาะ Superadmin เท่านั้นที่สามารถเพิ่มบัญชีได้', 'error');
                return;
            }

            Swal.fire({
                title: 'เพิ่มบัญชีผู้ใช้งานใหม่',
                html: `
                    <input id="newUsername" class="swal2-input" placeholder="ชื่อผู้ใช้ (Username)">
                    <input id="newPassword" type="password" class="swal2-input" placeholder="รหัสผ่าน (Password)">
                    <select id="newRole" class="swal2-select" style="display: flex; width: 70%; margin: 1em auto;">
                        <option value="admin">Admin (ผู้ดูแลทั่วไป)</option>
                        <option value="superadmin">Superadmin (ผู้ดูแลสูงสุด)</option>
                    </select>
                `,
                focusConfirm: false,
                showCancelButton: true,
                confirmButtonText: 'บันทึก',
                cancelButtonText: 'ยกเลิก',
                confirmButtonColor: '#4f46e5',
                preConfirm: () => {
                    const username = document.getElementById('newUsername').value.trim();
                    const password = document.getElementById('newPassword').value.trim();
                    const role = document.getElementById('newRole').value;

                    if (!username || !password) {
                        Swal.showValidationMessage('กรุณากรอกข้อมูลให้ครบถ้วน!');
                        return false;
                    }
                    return { username, password, role };
                }
            }).then((result) => {
                if (result.isConfirmed) {
                    const { username, password, role } = result.value;
                    let adminUsers = getAdminUsers();

                    // เช็คชื่อซ้ำ
                    if (adminUsers.some(u => u.username === username)) {
                        Swal.fire('ซ้ำซ้อน!', 'มีชื่อผู้ใช้นี้อยู่ในระบบแล้ว', 'error');
                        return;
                    }

                    adminUsers.push({ username, password, role });
                    localStorage.setItem('adminUsers', JSON.stringify(adminUsers));

                    Swal.fire('สำเร็จ!', `เพิ่มบัญชี ${username} (${role}) เรียบร้อยแล้ว`, 'success');
                }
            });
        }

        // ตัวอย่างฟังก์ชันสำหรับปุ่มลบข้อมูลที่ต้องใช้สิทธิ์ Superadmin
        function deleteImportantData() {
            if (!isSuperAdmin()) {
                Swal.fire('ไม่มีสิทธิ์!', 'สิทธิ์ Admin ธรรมดาไม่สามารถลบข้อมูลนี้ได้', 'warning');
                return;
            }
            // โค้ดการลบข้อมูล...
        }
    </script>
</body>
</html>
