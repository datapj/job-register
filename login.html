<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - เข้าสู่ระบบผู้ดูแลระบบ</title>

    <!-- Google Fonts & FontAwesome -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- ไฟล์ CSS หลัก -->
    <link rel="stylesheet" href="css/login.css">
</head>
<body>

    <!-- ปุ่มย้อนกลับไปหน้าแรก -->
    <a href="index.html" class="back-btn">
        <i class="fa-solid fa-arrow-left"></i> กลับหน้าฟอร์ม
    </a>

    <!-- การ์ดฟอร์มเข้าสู่ระบบ -->
    <div class="login-card">
        <div class="brand-icon">
            <i class="fa-solid fa-user-shield"></i>
        </div>
        <h2>เข้าสู่ระบบ Admin</h2>
        <p class="subtitle">กรอกชื่อผู้ใช้และรหัสผ่านเพื่อเข้าใช้งาน</p>

        <form id="loginForm">
            <div class="form-group">
                <label for="username">ชื่อผู้ใช้ (Username)</label>
                <div class="input-wrapper">
                    <input type="text" id="username" required placeholder="กรอก Username" autocomplete="username">
                    <i class="fa-solid fa-user input-icon"></i>
                </div>
            </div>
            <div class="form-group">
                <label for="password">รหัสผ่าน (Password)</label>
                <div class="input-wrapper">
                    <input type="password" id="password" required placeholder="กรอก Password" autocomplete="current-password">
                    <i class="fa-solid fa-lock input-icon"></i>
                    <i class="fa-solid fa-eye-slash toggle-password" id="togglePassword"></i>
                </div>
                <div style="text-align: right; margin-top: 10px; margin-bottom: 18px;">
                    <a href="#" id="forgotPassword" style="color: #64748b; font-size: 0.85rem; text-decoration: none; transition: color 0.2s;">
                        <i class="fa-solid fa-key"></i> ลืมรหัสผ่าน?
                    </a>
                </div>
            </div>
            <button type="submit" class="login-btn">
                <i class="fa-solid fa-right-to-bracket"></i> เข้าสู่ระบบ
            </button>
        </form>
    </div>

    <!-- ไฟล์ JS หลัก -->
    <script src="js/login.js"></script>
</body>
</html>
