<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    
    <!-- Google Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- External Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Custom CSS Styles -->
    <link rel="stylesheet" href="css/admin-dashboard.css">
</head>

<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="nav-left">
            <div class="navbar-brand">
                <i class="fa-solid fa-shield-halved"></i>Admin Portal
            </div>
        </div>

        <div class="nav-actions">
            <button class="btn-header" onclick="openSettingsModal()">
                <i class="fa-solid fa-key"></i> Change password by Admin
            </button>
            <button class="btn-header btn-logout" onclick="logoutAdmin()">
                <i class="fa-solid fa-right-from-bracket"></i> ออกจากระบบ
            </button>
        </div>
    </nav>

    <!-- Main Container -->
    <div class="container">
        <!-- 📊 Stat Cards -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-title">ผู้ติดต่อทั้งหมด</div>
                <div class="stat-number" id="statTotal">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-title">🆕 มาใหม่</div>
                <div class="stat-number" id="statNew">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-title">⏳ กำลังติดต่อ</div>
                <div class="stat-number" id="statPending">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-title">✅ ดำเนินการแล้ว</div>
                <div class="stat-number" id="statDone">0</div>
            </div>
        </div>

        <!-- 📈 Analytics Chart -->
        <div class="chart-card">
            <h3 class="chart-title"><i class="fa-solid fa-chart-line"></i> สถิติการติดต่อเข้ามา</h3>
            <div class="chart-container">
                <canvas id="contactChart"></canvas>
            </div>
        </div>

        <!-- 🔍 Search & Filter Bar -->
        <div class="filter-card">
            <input type="text" id="searchInput" class="filter-input" placeholder="🔍 ค้นหาตาม ชื่อ, LINE ID, เบอร์โทร..." oninput="renderTable()">
            <select id="statusFilter" class="filter-input" onchange="renderTable()">
                <option value="">-- กรองตามสถานะทั้งหมด --</option>
                <option value="🆕 มาใหม่">🆕 มาใหม่</option>
                <option value="⏳ กำลังติดต่อ">⏳ กำลังติดต่อ</option>
                <option value="✅ ดำเนินการแล้ว">✅ ดำเนินการแล้ว</option>
            </select>
        </div>

        <!-- 📋 Data Table -->
        <div class="table-card">
            <table>
                <thead>
                    <tr>
                        <th style="width: 15%;">วัน-เวลา</th>
                        <th style="width: 20%;">ชื่อ - นามสกุล</th>
                        <th style="width: 20%;">LINE ID / เบอร์โทร</th>
                        <th style="width: 25%;">ข้อความ</th>
                        <th style="width: 12%;">สถานะงาน</th>
                        <th style="width: 8%;">จัดการ</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>

    <!-- ⚙️ Modal เปลี่ยนรหัสผ่าน Admin -->
    <div class="modal" id="settingsModal" onclick="closeModalOnBackdrop(event)">
        <div class="modal-content">
            <h3 class="modal-title"><i class="fa-solid fa-key"></i> ตั้งค่ารหัสผ่าน Admin</h3>
            <form id="changePasswordForm">
                <div class="form-group">
                    <label class="form-label">Username ใหม่</label>
                    <input type="text" id="newUsername" class="filter-input w-full" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Password ใหม่</label>
                    <input type="password" id="newPassword" class="filter-input w-full" placeholder="กรอกรหัสผ่านใหม่" required>
                </div>
                <div class="modal-actions">
                    <button type="submit" class="btn-header btn-primary">บันทึก</button>
                    <button type="button" class="btn-header btn-cancel" onclick="closeSettingsModal()">ยกเลิก</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Custom JavaScript -->
    <script src="js/admin-dashboard.js"></script>
</body>
</html>
